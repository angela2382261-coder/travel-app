<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- ⭐ 手機關鍵 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ⭐ App 模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- ⭐ Icon -->
  <link rel="apple-touch-icon" href="icon.png">

  <title>Travel App</title>

<style>
body {
  margin: 0;
  background: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont;
}

/* 💰 預算卡 */
.budget {
  background: #fff;
  border-radius: 20px;
  padding: 16px;
  margin: 16px;
  font-size: 18px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
}

/* 🗓 卡片 */
.card {
  background: #fff;
  border-radius: 20px;
  margin: 0 16px 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.08);
  overflow: hidden;
  transition: all 0.25s ease;
}

/* 👉 點擊動畫 */
.card:active {
  transform: scale(0.97);
}

/* 標題 */
.header {
  padding: 16px;
  font-size: 20px;
  font-weight: 600;
  background: #fafafa;
}

/* ✨ 展開動畫 */
.content {
  max-height: 0;
  overflow: hidden;
  transition: all 0.35s ease;
}

.content.open {
  max-height: 1000px;
}

/* 每一列 */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-top: 1px solid #eee;
  transition: background 0.2s;
}

.row:active {
  background: #f5f5f5;
}

/* 左側 */
.left {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* checkbox 放大 */
input[type="checkbox"] {
  transform: scale(1.3);
}

/* 🏷 tag */
.tag {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 8px;
}

.tag.food { background: #ffe4e6; }
.tag.spot { background: #e0f2fe; }
.tag.transport { background: #fef9c3; }
.tag.hotel { background: #dcfce7; }
.tag.other { background: #eee; }

/* 📍 按鈕 */
.mapBtn {
  border: none;
  background: #f1f1f1;
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 18px;
}
</style>

  

</head>
<body>

  <div id="app">Loading...</div>

  <script src="app.js"></script>

</body>
</html>
