<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- ⭐ 手機關鍵 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ⭐ App 模式 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- ⭐ Icon -->
  <link rel="apple-touch-icon" href="icon.png">

  <title>Travel App</title>

<style>
body {
  margin: 0;
  background: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont;
}

/* 容器 */
#app {
  padding: 16px;
}

/* 💰 預算卡 */
.budget {
  background: white;
  padding: 16px;
  border-radius: 16px;
  margin-bottom: 16px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  font-size: 18px;
}

/* 📦 卡片 */
.card {
  background: white;
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.08);
  transition: 0.2s;
}

/* ✨ 卡片按壓效果 */
.card:active {
  transform: scale(0.97);
}

/* 📌 標題 */
.header {
  font-size: 20px;
  font-weight: 600;
  margin-bottom: 10px;
  cursor: pointer;
}

/* 📋 行 */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid #eee;
}

/* checkbox 放大 */
.row input {
  transform: scale(1.3);
}

/* 地圖按鈕 */
.mapBtn {
  font-size: 18px;
  border: none;
  background: #eee;
  border-radius: 10px;
  padding: 6px 10px;
}
</style>


  

</head>
<body>

  <div id="app">Loading...</div>

  <script src="app.js"></script>

</body>
</html>
